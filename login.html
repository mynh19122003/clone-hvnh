<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Cổng thông tin đào tạo - Học viện Ngân hàng</title>
    <link rel="shortcut icon" href="assets/logo/logo.png" type="image/x-icon" />
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=2.9" />

    <!-- jQuery & Bootstrap JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f2f4f7;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .login-page-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        input, button, select, textarea {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 36px 32px 30px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: cardEntrance 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-card.card-exit {
            transform: translateY(-12px) scale(0.97);
            opacity: 0;
        }

        .login-card.shake {
            animation: cardShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        /* Top Progress Bar (NProgress / PSC UI loader) */
        .card-loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #e5e7eb;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .card-loader.active {
            opacity: 1;
        }

        .card-loader-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #056382, #077da5, #056382);
            box-shadow: 0 0 10px rgba(5, 99, 130, 0.8);
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-loader.indeterminate .card-loader-bar {
            width: 45%;
            animation: barIndeterminate 1.15s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
        }

        @keyframes barIndeterminate {
            0% { left: -45%; width: 35%; }
            50% { left: 25%; width: 60%; }
            100% { left: 100%; width: 45%; }
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes cardShake {
            0%, 100% { transform: translateX(0); }
            15%, 45%, 75% { transform: translateX(-8px); }
            30%, 60%, 90% { transform: translateX(8px); }
        }

        .logo-box {
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
            transition: transform 0.3s ease;
        }

        .logo-box:hover {
            transform: scale(1.02);
        }

        /* Large circular logo replicating online.hvnh.edu.vn/Login (170px) */
        .login-logo-img {
            width: 170px;
            height: 170px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            margin: 0 auto;
            box-shadow: 0 4px 16px rgba(5, 99, 130, 0.12);
        }

        .school-title {
            margin-top: 9px;
            font-size: 15.5px;
            font-weight: bold;
            color: #056382;
            letter-spacing: 0.3px;
        }

        .portal-subtitle {
            margin-top: 2px;
            font-size: 13.5px;
            color: #056382;
            margin-bottom: 12px;
        }

        .login-divider {
            position: relative;
            margin: 0 0 16px 0;
            border-top: 1px solid #dcdfe4;
        }

        .login-divider::after {
            content: "-*-";
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            padding: 0 8px;
            color: #888888;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .form-control {
            width: 100%;
            height: 38px;
            padding: 8px 12px;
            font-size: 13.5px;
            color: #1f2937;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            outline: none;
        }

        .form-control::placeholder {
            color: #9ca3af;
            font-size: 13.5px;
        }

        .form-control:focus {
            border-color: #056382;
            box-shadow: 0 0 0 3px rgba(5, 99, 130, 0.15);
        }

        .form-control.input-error {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
            background-color: #fffbfb;
        }

        /* Captcha Box replicating HVNH Login */
        .captcha-wrapper {
            margin-bottom: 14px;
            text-align: left;
        }

        .captcha-canvas-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        #captchaCanvas {
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #ffffff;
            cursor: pointer;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
            transition: opacity 0.2s ease;
        }

        #captchaCanvas:hover {
            opacity: 0.92;
        }

        .captcha-refresh-btn {
            background: none;
            border: none;
            color: #056382;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s ease, color 0.2s ease;
        }

        .captcha-refresh-btn:hover {
            transform: rotate(180deg);
            color: #03485f;
        }

        .captcha-label {
            font-size: 13px;
            color: #334155;
            margin-bottom: 4px;
            text-align: left;
        }

        /* Submit Button with HVNH Teal Blue */
        .btn-login {
            width: 100%;
            height: 40px;
            background-color: #056382;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
            transition: background-color 0.25s ease, transform 0.12s ease, box-shadow 0.25s ease;
            box-shadow: 0 2px 6px rgba(5, 99, 130, 0.25);
            user-select: none;
        }

        .btn-login:hover:not(:disabled) {
            background-color: #03485f;
            box-shadow: 0 4px 12px rgba(5, 99, 130, 0.35);
        }

        .btn-login:active:not(:disabled) {
            background-color: #022e3d;
            transform: scale(0.985);
        }

        .btn-login:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        /* Button Loading State */
        .btn-login.is-loading {
            background: linear-gradient(90deg, #056382, #077da5, #056382);
            background-size: 200% 100%;
            animation: btnShimmer 1.5s infinite;
            cursor: wait;
            pointer-events: none;
            box-shadow: 0 4px 14px rgba(5, 99, 130, 0.35);
        }

        @keyframes btnShimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* Button Success State */
        .btn-login.is-success {
            background-color: #16a34a !important;
            box-shadow: 0 4px 14px rgba(22, 163, 74, 0.4) !important;
            pointer-events: none;
            transform: scale(1.01);
        }

        /* Button Error State */
        .btn-login.is-error {
            background-color: #dc2626 !important;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35) !important;
            animation: btnWiggle 0.4s ease-in-out;
        }

        @keyframes btnWiggle {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* Circular Spinner Icon */
        .btn-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: btnRotate 0.65s linear infinite;
            display: inline-block;
            flex-shrink: 0;
        }

        @keyframes btnRotate {
            to { transform: rotate(360deg); }
        }

        /* Checkmark Icon */
        .btn-checkmark {
            width: 17px;
            height: 17px;
            stroke: #ffffff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            display: inline-block;
            flex-shrink: 0;
        }

        .btn-checkmark path {
            stroke-dasharray: 24;
            stroke-dashoffset: 24;
            animation: checkmarkDraw 0.35s ease-out forwards;
        }

        @keyframes checkmarkDraw {
            to { stroke-dashoffset: 0; }
        }

        /* Ripple Effect */
        .ripple-circle {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.45);
            transform: scale(0);
            animation: rippleAnim 0.55s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .alert-box {
            margin-bottom: 14px;
            padding: 9px 12px;
            border-radius: 4px;
            font-size: 13px;
            text-align: left;
            display: none;
            animation: alertSlideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes alertSlideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-error {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background-color: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .test-helper {
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px dashed #e5e7eb;
            font-size: 12px;
            color: #6b7280;
        }

        .test-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 5px 10px;
            border-radius: 4px;
            color: #0284c7;
            font-weight: 600;
            font-size: 11.5px;
            cursor: pointer;
            margin-top: 6px;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .test-btn:hover {
            background: #f0f9ff;
            border-color: #0284c7;
            transform: translateY(-1px);
        }

        .back-home {
            display: inline-block;
            margin-top: 12px;
            color: #64748b;
            font-size: 12px;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .back-home:hover {
            color: #056382;
            text-decoration: underline;
        }
    </style>
</head>

    <header id="header">
        <nav class="navbar navbar-default stylecolor" style="margin-bottom: 0;">

    <div class="login-page-body">
        <div class="login-card" id="loginCard">
            <!-- Top Animated Running Progress Bar -->
            <div class="card-loader" id="cardLoader">
                <div class="card-loader-bar" id="cardLoaderBar"></div>
            </div>

        <!-- Logo Học viện Ngân hàng (170px như web trường online.hvnh.edu.vn) -->
        <div class="logo-box">
            <img src="assets/logo/logo.png" alt="Học viện Ngân hàng" class="login-logo-img">
        </div>

        <div class="school-title">HỌC VIỆN NGÂN HÀNG</div>
        <div class="portal-subtitle">Cổng thông tin đào tạo</div>
        <div class="login-divider"></div>

        <div id="loginAlert" class="alert-box"></div>

        <form id="frmLogin" onsubmit="handleLoginSubmit(event)">
            <div class="form-group">
                <input type="text" class="form-control" id="txtUsername" placeholder="Tên đăng nhập" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <input type="password" class="form-control" id="txtPassword" placeholder="Mật khẩu" required autocomplete="current-password">
            </div>

            <!-- Mã bảo vệ Captcha chuẩn web trường -->
            <div class="captcha-wrapper">
                <div class="captcha-canvas-box">
                    <canvas id="captchaCanvas" width="220" height="46" onclick="generateCaptcha()" title="Nhấp để đổi mã bảo vệ"></canvas>
                    <button type="button" class="captcha-refresh-btn" onclick="generateCaptcha()" title="Đổi mã bảo vệ">↻</button>
                </div>
                <div class="captcha-label">Nhập mã bảo vệ:</div>
                <input type="text" class="form-control" id="txtCaptcha" placeholder="" autocomplete="off" required>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <span class="btn-text" id="btnText">Đăng nhập</span>
            </button>
        </form>

        <div class="test-helper">
            <div>Tài khoản test: <strong>008307000568</strong> | Mật khẩu: <strong>12351235</strong></div>
            <button type="button" class="test-btn" onclick="fillTestAccount()">
                ⚡ Điền tài khoản test
            </button>
            <br>
            <a href="index.html#/" class="back-home">← Cổng thông tin đào tạo HVNH</a>
        </div>
    </div>
    </div>

    <!-- Application Data -->
    <script src="assets/js/data.js"></script>
    <script>
        let isLoggingIn = false;

        // Ripple Effect on Button Click
        const btnLogin = document.getElementById("btnLogin");
        btnLogin.addEventListener("click", function (e) {
            if (isLoggingIn) return;
            const rect = btnLogin.getBoundingClientRect();
            const ripple = document.createElement("span");
            ripple.className = "ripple-circle";
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + "px";
            ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
            ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
            btnLogin.appendChild(ripple);
            setTimeout(() => ripple.remove(), 550);
        });

        let currentCaptcha = "";

        function generateCaptcha() {
            const canvas = document.getElementById("captchaCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            currentCaptcha = "";
            for (let i = 0; i < 5; i++) {
                currentCaptcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            // White background
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Blue noisy dots replicating HVNH captcha
            for (let i = 0; i < 350; i++) {
                ctx.fillStyle = Math.random() > 0.4 ? "rgba(0, 20, 180, 0.4)" : "rgba(0, 80, 240, 0.25)";
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1.5, 1.5);
            }

            // Blue letters
            ctx.font = "bold 23px 'Courier New', monospace, sans-serif";
            ctx.fillStyle = "#0018a8";
            ctx.textBaseline = "middle";
            for (let i = 0; i < currentCaptcha.length; i++) {
                const char = currentCaptcha[i];
                const x = 20 + i * 38 + (Math.random() * 4 - 2);
                const y = canvas.height / 2 + (Math.random() * 4 - 2);
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate((Math.random() - 0.5) * 0.18);
                ctx.fillText(char, 0, 0);
                ctx.restore();
            }

            // Noise lines
            for (let i = 0; i < 4; i++) {
                ctx.strokeStyle = "rgba(0, 50, 200, 0.25)";
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.stroke();
            }
        }

        // Initialize captcha on load
        if (document.readyState === "loading") {
            window.addEventListener("DOMContentLoaded", generateCaptcha);
        } else {
            generateCaptcha();
        }

        function fillTestAccount() {
            if (isLoggingIn) return;
            document.getElementById("txtUsername").value = "008307000568";
            document.getElementById("txtPassword").value = "12351235";
            const captchaInput = document.getElementById("txtCaptcha");
            if (captchaInput) captchaInput.value = currentCaptcha;
            document.getElementById("txtUsername").classList.remove("input-error");
            document.getElementById("txtPassword").classList.remove("input-error");
            if (captchaInput) captchaInput.classList.remove("input-error");
            showAlert("", "");
        }

        function showAlert(msg, type) {
            const alertBox = document.getElementById("loginAlert");
            if (!msg) {
                alertBox.style.display = "none";
                alertBox.innerHTML = "";
                return;
            }
            alertBox.className = "alert-box " + (type === "success" ? "alert-success" : "alert-error");
            alertBox.innerHTML = msg;
            alertBox.style.display = "block";
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            if (isLoggingIn) return;

            const uInput = document.getElementById("txtUsername");
            const pInput = document.getElementById("txtPassword");
            const cInput = document.getElementById("txtCaptcha");
            const u = uInput.value.trim();
            const p = pInput.value.trim();
            const c = cInput ? cInput.value.trim() : "";
            const btn = document.getElementById("btnLogin");
            const card = document.getElementById("loginCard");
            const loader = document.getElementById("cardLoader");
            const loaderBar = document.getElementById("cardLoaderBar");

            uInput.classList.remove("input-error");
            pInput.classList.remove("input-error");
            if (cInput) cInput.classList.remove("input-error");
            card.classList.remove("shake");
            showAlert("", "");

            if (!u || !p) {
                card.classList.add("shake");
                if (!u) uInput.classList.add("input-error");
                if (!p) pInput.classList.add("input-error");
                showAlert("Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!", "error");
                setTimeout(() => card.classList.remove("shake"), 500);
                return;
            }

            if (cInput && c.toUpperCase() !== currentCaptcha.toUpperCase()) {
                card.classList.add("shake");
                cInput.classList.add("input-error");
                showAlert("Mã bảo vệ không chính xác!", "error");
                setTimeout(() => card.classList.remove("shake"), 500);
                generateCaptcha();
                return;
            }

            // 1. Start loading animation
            isLoggingIn = true;
            btn.disabled = true;
            btn.classList.add("is-loading");
            btn.innerHTML = `
                <span class="btn-spinner"></span>
                <span>Đang đăng nhập...</span>
            `;

            // Trigger card top loading progress bar
            loader.classList.add("active", "indeterminate");

            // 2. Realistic authentic server authentication delay (700ms)
            setTimeout(() => {
                const student = HVNH_DATA && HVNH_DATA.students ? HVNH_DATA.students[u] : null;

                if (!student || student.password !== p) {
                    // Fail state: Shake card, flash red button, show error
                    isLoggingIn = false;
                    loader.classList.remove("indeterminate", "active");
                    loaderBar.style.width = "0%";

                    btn.classList.remove("is-loading");
                    btn.classList.add("is-error");
                    btn.innerHTML = `
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                        <span>Sai thông tin!</span>
                    `;

                    pInput.classList.add("input-error");
                    card.classList.add("shake");
                    showAlert("Tên đăng nhập hoặc mật khẩu không chính xác!", "error");

                    // Reset button after 900ms
                    setTimeout(() => {
                        btn.classList.remove("is-error");
                        btn.disabled = false;
                        btn.innerHTML = `<span>Đăng nhập</span>`;
                        card.classList.remove("shake");
                        pInput.focus();
                    }, 900);
                    return;
                }

                // 3. Success state: Progress bar completes, button turns green with checkmark
                loader.classList.remove("indeterminate");
                loaderBar.style.width = "100%";

                btn.classList.remove("is-loading");
                btn.classList.add("is-success");
                btn.innerHTML = `
                    <svg class="btn-checkmark" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
                    <span>Đăng nhập thành công!</span>
                `;

                // Save session with try/catch
                try {
                    localStorage.setItem("hvnh_user", JSON.stringify(student));
                } catch (err) {
                    console.warn("localStorage restricted:", err);
                }

                // 4. Smooth card exit transition before redirecting
                setTimeout(() => {
                    card.classList.add("card-exit");
                    setTimeout(() => {
                        window.location.href = "index.html?user=" + encodeURIComponent(u) + "#/portal";
                    }, 350);
                }, 500);
            }, 700);
        }
    </script>
</body>
</html>
